[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "document-extraction-pipeline"
version = "0.1.0"
description = "Document ingestion with verifiable source references, ready for AI extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/document_extraction_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
